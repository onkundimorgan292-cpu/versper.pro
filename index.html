<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Deriv Market Data Demo</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 400px; }
        #price { font-size: 2em; font-weight: bold; color: #2a9d8f; }
        #status { color: #666; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Deriv Live Price</h1>
        <div id="status">Connecting...</div>
        <div>Symbol: <strong>Volatility 100 Index (1HZ100V)</strong></div>
        <div id="price">--</div>
    </div>

    <script>
        // Public endpoint, no token required
        const ws = new WebSocket('wss://api.derivws.com/trading/v1/options/ws/public');

        ws.onopen = () => {
            document.getElementById('status').textContent = 'Connected (Public)';
            // Subscribe to tick data
            ws.send(JSON.stringify({
                ticks: '1HZ100V',
                subscribe: 1,
                req_id: 1
            }));
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.msg_type === 'tick') {
                const price = data.tick.quote;
                document.getElementById('price').textContent = price;
            }
        };

        ws.onerror = (err) => {
            document.getElementById('status').textContent = 'Error';
            console.error(err);
        };

        ws.onclose = () => {
            document.getElementById('status').textContent = 'Disconnected';
        };
    </script>
</body>
</html>
